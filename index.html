<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Meus Gastos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F3F5F9" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meus Gastos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- Entrar -->
<main id="login" class="login" hidden>
  <form id="loginForm" class="card login-card" autocomplete="on">
    <div class="logo" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><path d="M4 7.5V17a2 2 0 0 0 2 2h12a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H6.5A2.5 2.5 0 0 1 4 7.5z"/><circle cx="15.5" cy="13.5" r="1.2"/></svg>
    </div>
    <h1>Meus Gastos</h1>
    <p class="muted">Digite sua senha para entrar.</p>
    <input class="sr-only" type="text" name="username" autocomplete="username" value="meus-gastos" tabindex="-1" aria-hidden="true" readonly>
    <label for="pw" class="lbl">Senha</label>
    <input id="pw" class="input" type="password" name="password" autocomplete="current-password" required>
    <p id="loginMsg" class="msg" role="alert" hidden></p>
    <button class="btn primary block" type="submit" id="loginBtn">Entrar</button>
  </form>
</main>

<!-- Erro de configuração -->
<main id="problem" class="login" hidden>
  <section class="card login-card">
    <h1 id="problemTitle">Algo precisa de ajuste</h1>
    <p id="problemText" class="muted"></p>
    <ul id="problemList"></ul>
    <button class="btn block" type="button" data-act="reload">Tentar de novo</button>
  </section>
</main>

<!-- App -->
<div id="app" class="app" hidden>
  <div class="scroll" id="scroll">
    <div class="wrap">
      <header class="head">
        <div class="brand">
          <div class="logo sm" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><path d="M4 7.5V17a2 2 0 0 0 2 2h12a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H6.5A2.5 2.5 0 0 1 4 7.5z"/><circle cx="15.5" cy="13.5" r="1.2"/></svg>
          </div>
          <div>
            <h1 class="title">Meus Gastos</h1>
            <p class="muted small" id="subtitle">Itaú</p>
          </div>
        </div>
        <div class="head-actions">
          <button class="icon-btn" type="button" data-act="theme" aria-label="Alternar entre tema claro e escuro" id="themeBtn"></button>
          <div class="month">
            <button class="icon-btn flat" type="button" data-act="prev" aria-label="Mês anterior"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
            <span id="monthLabel" class="month-label"></span>
            <button class="icon-btn flat" type="button" data-act="next" aria-label="Próximo mês"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
          </div>
          <button class="btn primary" type="button" data-act="add">+ Lançar</button>
        </div>
      </header>
      <div id="banner"></div>
      <div id="view"></div>
    </div>
  </div>

  <nav class="tabs" aria-label="Seções">
    <div class="tabs-in">
      <button type="button" class="tab" data-tab="inicio"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg></span>Início</button>
      <button type="button" class="tab" data-tab="gastos"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10a1 1 0 0 1 1 1v15l-3-2-3 2-3-2-3 2V5a1 1 0 0 1 1-1z"/><path d="M9.5 9h5M9.5 13h5"/></svg></span>Gastos</button>
      <button type="button" class="tab" data-tab="simular"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h9M18 7h1M5 17h1M10 17h9"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></span>Simular</button>
      <button type="button" class="tab" data-tab="fixos"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 4l3 3-3 3"/><path d="M4 11V9a2 2 0 0 1 2-2h14"/><path d="M7 20l-3-3 3-3"/><path d="M20 13v2a2 2 0 0 1-2 2H4"/></svg></span>Fixos</button>
      <button type="button" class="tab" data-tab="metas"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.6"/></svg></span>Metas</button>
    </div>
  </nav>
</div>

<dialog id="dlg" class="dlg"></dialog>

<script src="/app.js" defer></script>
</body>
</html>
